# ==========================================
# ThreadVault Production Application Config
# ==========================================

# Server configuration
server.port=${PORT:8080}
server.shutdown=graceful

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ThreadVault Core Defaults & Paths
threadvault.default-workers=${THREADVAULT_DEFAULT_WORKERS:4}
threadvault.storage-path=${THREADVAULT_STORAGE_PATH:backup_storage}
threadvault.metadata-path=${THREADVAULT_METADATA_PATH:metadata}

# OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Logging Configuration
logging.level.root=INFO
logging.level.controller=INFO
logging.level.service=INFO
logging.level.backup=INFO
logging.level.restore=INFO
logging.level.metadata=INFO
logging.level.event=INFO

