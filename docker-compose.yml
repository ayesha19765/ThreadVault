services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: threadvault-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - THREADVAULT_DEFAULT_WORKERS=4
      - THREADVAULT_STORAGE_PATH=/app/backup_storage
      - THREADVAULT_METADATA_PATH=/app/metadata
    volumes:
      - threadvault_storage:/app/backup_storage
      - threadvault_metadata:/app/metadata
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
    container_name: threadvault-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  threadvault_storage:
    name: threadvault_storage
  threadvault_metadata:
    name: threadvault_metadata

